[project]
name = "contoso-mesh"
version = "0.1.0"
description = "ContosoMesh Supply Management Demo with Azure AI Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "semantic-kernel>=1.0.0",
    "azure-search-documents>=11.4.0",
    "azure-ai-openai>=1.0.0",
    "azure-identity>=1.15.0",
    "pydantic>=2.5.0",
    "sqlite3",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "asyncio",
    "aiofiles>=23.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]